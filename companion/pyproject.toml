[project]
name = "msms-shortlist"
version = "0.1.0"
description = "Companion code for rewire.it article 335: formula-free MS/MS candidate shortlisting"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
    "torch==2.2.1",
    "numpy==1.25.0",
    "pandas==2.2.1",
    "rdkit==2023.9.6",
    "h5py==3.11.0",
    "pyyaml==6.0.3",
    "matplotlib==3.8.4",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "ipykernel==6.29.5",
]

[project.scripts]
msms-shortlist = "msms_shortlist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["msms_shortlist"]
