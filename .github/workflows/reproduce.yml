name: Verify historical evidence and regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    # The frozen companion lock uses CPU PyTorch on macOS; Linux installs CUDA dependencies.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.2"
      - run: make verify
